name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        # 'latest' tracks the newest Node release to match the devcontainer's
        # node:latest-dev base image. Non-deterministic by design: a passing run
        # can later fail when Node ships a new version, with no code change.
        node: [22, 24, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm pack --pack-destination "$(mktemp -d)"
