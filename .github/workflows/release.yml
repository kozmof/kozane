name: Release packages

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate publishing without changing npm
        type: boolean
        default: true

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm verify
      - run: pnpm audit:production
      - run: pnpm smoke:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/browser-spike/build.mjs
      - run: pnpm exec playwright test --config scripts/browser-spike/playwright.config.ts
      - run: pnpm test:restoration-harness
      - run: pnpm test:client-package
      - name: Publish packages in dependency order
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm -r publish --access public --provenance --dry-run
          else
            pnpm publish:npm
          fi
      - name: Verify exact registry installations and provenance metadata
        if: ${{ !inputs.dry-run }}
        run: pnpm release:verify:registry
